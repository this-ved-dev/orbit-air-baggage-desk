# STRETCH GOAL 3: run pytest and ruff on every pull request (and on pushes to main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: pytest
        # exit code 5 means no tests collected yet (main before the first feature branch)
        run: pytest || [ $? -eq 5 ]
